<script>try{var t=localStorage.getItem("theme")||"sys";document.documentElement.setAttribute("data-theme",(t==="dark"||(t==="sys"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light")}catch(e){}</script>
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#1c1f26;--mut:#6b7080;--mut2:#8a8f9c;--line:#eceef2;--soft:#f0f1f4;--inp:#fafbfc;--inpb:#e3e5ea;--sh:0 0 0 1px rgba(20,25,40,.06);--acc:#3f6fd8;--red:#d64545;--dred:#a61b1b;--org:#c27a12;--grn:#22804c}
[data-theme=dark]{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mut:#9aa1b0;--mut2:#7c8394;--line:#2a2e38;--soft:#252934;--inp:#14171d;--inpb:#323745;--sh:0 0 0 1px rgba(255,255,255,.06);--acc:#7aa0ff;--red:#ff6b6b;--dred:#ff4d4d;--org:#f0a742;--grn:#4cc684}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
.top .st{font-size:11px;color:var(--mut2);margin-top:2px;min-height:13px}
.pbtn{border:0;background:var(--card);box-shadow:var(--sh);border-radius:22px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;max-width:55%}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff9a3d,#e8492f);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.av.big{width:56px;height:56px;font-size:20px}
h2{font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 span{text-transform:none;letter-spacing:0;font-weight:500}
h2 .lnk{font-size:12px;letter-spacing:0;text-transform:none}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}
.wtitle{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.wgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.btn{border:0;background:var(--soft);font-weight:600;font-size:13px;border-radius:10px;padding:9px 12px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--tx);color:var(--bg)}
.btn.full{display:block;width:100%;padding:13px;font-size:14px;border-radius:13px}
.btn.red{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}
.btn.line{background:var(--card);box-shadow:inset 0 0 0 1px var(--inpb)}
.btn.sm{font-size:12px;padding:6px 10px}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}
.row2{display:flex;gap:8px;align-items:center}
input,textarea,select{font:inherit;font-size:15px;border:1px solid var(--inpb);border-radius:10px;padding:10px 11px;background:var(--inp);color:var(--tx);width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 2px 5px}
.err{color:var(--red);font-size:13px;margin-top:10px}
.ok{color:var(--grn);font-size:13px;margin-top:10px}
.muted{color:var(--mut2);font-size:12.5px;line-height:1.5}
.empty{color:var(--mut2);font-size:13px;text-align:center;padding:16px 0}
.back{background:none;border:0;font-size:14px;font-weight:600;color:var(--acc);cursor:pointer;padding:6px 0;margin-top:4px}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;background:var(--tx);color:var(--bg);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;background:var(--soft);color:var(--mut)}
.chip.over{background:var(--dred);color:#fff}.chip.edge{background:color-mix(in srgb,var(--red) 15%,var(--card));color:var(--red)}.chip.warn{background:color-mix(in srgb,var(--org) 16%,var(--card));color:var(--org)}.chip.ok{background:color-mix(in srgb,var(--grn) 15%,var(--card));color:var(--grn)}
.chip.acc{background:color-mix(in srgb,var(--acc) 15%,var(--card));color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:9}
nav .in{display:flex;max-width:760px;margin:0 auto}
nav .brand{display:none}
nav button{flex:1;border:0;background:none;font-size:10.5px;font-weight:600;color:var(--mut2);padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-width:0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
nav button.on{color:var(--tx)}
nav .dot{position:absolute;top:3px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--red)}
/* subject-colored rows */
.sc{--bgc:color-mix(in srgb,var(--a) 10%,var(--card))}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--bgc);position:relative}
.slot+.slot{margin-top:8px}
.slot::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--a)}
.slot .tm{font-weight:700;font-size:13px;width:44px;font-variant-numeric:tabular-nums}
.slot .tm s{display:block;font-weight:500;color:var(--mut2);font-size:11px}
.slot .info{flex:1;min-width:0}
.slot .nm{font-weight:600;font-size:14px}
.slot .ty{font-size:11.5px;color:var(--mut);margin-top:2px}
.slot .acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.slot.now{box-shadow:inset 0 0 0 2px var(--a)}
.slot.past{opacity:.55}
.slot.cancel .nm{text-decoration:line-through}
.slot.off{background:color-mix(in srgb,var(--red) 12%,var(--card))}.slot.off::before{background:var(--red)}
.tag{white-space:nowrap;display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--a);color:#fff;margin-left:6px;vertical-align:1px}
.tag.red{background:var(--red)}.tag.org{background:var(--org)}.tag.gry{background:var(--mut2)}
.mark{background:var(--card);box-shadow:inset 0 0 0 1px var(--inpb);font-size:12px;padding:7px 10px;white-space:nowrap}

.atu .ainfo.s2{border-left:4px solid #357a32}.atu .ainfo.s1{border-left:4px solid #f0ad4e}.atu .ainfo.s0{border-left:4px solid #ca3120}
.atu .aflag{background:none;border:0;font:inherit;color:#0f6cbf;font-size:12.5px;cursor:pointer;padding:0}.atu .aflag.on{color:#ca3120}
.atu .aform{margin:8px 12px 0;background:#e7f3f5;border-radius:4px;padding:12px;font-size:14px;line-height:1.5;color:#001a1e}
.atu .aq{white-space:pre-wrap}
.atu .ast{margin-top:6px;font-size:13.5px}
.atu .arad{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;font:inherit;color:#001a1e;font-size:14px;padding:5px 0;cursor:pointer;line-height:1.4}
.atu .arad .rb{flex:none;width:16px;height:16px;border-radius:50%;border:1px solid #8f959e;background:#fff;margin-top:2px}
.atu .arad.on .rb{border:5px solid #0f6cbf}
.atu .arad.ok{background:#d7efd8;border-radius:4px}.atu .arad.no{background:#f6d6d2;border-radius:4px}
.atu .arad:disabled{cursor:default;opacity:1}
.atu .oq{margin-top:6px}
.atu .omut{color:#4c5a63;margin:0 0 2px;font-size:12.5px}
.atu .omr{background:none;box-shadow:none;padding:0;margin-top:9px;border-radius:0}
.atu .omr .ot{font-weight:400;font-size:14px;color:#001a1e}
.atu .omr select{background:#fff;color:#1d2125;border:1px solid #8f959e;border-radius:4px;font-size:13.5px;padding:6px 8px;max-width:62%;min-width:130px}
.atu .omr select:focus{outline:0;border-color:#0f6cbf;box-shadow:0 0 0 3px rgba(15,108,191,.25)}
.atu .omr select.ok{border:2px solid #357a32;background:#d7efd8}.atu .omr select.no{border:2px solid #ca3120;background:#f6d6d2}.atu .omr select.miss{border:1px dashed #ca3120}
.atu .ock{background:none;box-shadow:none;border:0;border-radius:4px;padding:5px 2px;margin-top:3px;font-size:14px;color:#001a1e}
.atu .ock .b{width:16px;height:16px;border-radius:3px;border:1px solid #8f959e;background:#fff;font-size:11px;color:#fff;margin-top:2px}
.atu .ock.on .b{background:#0f6cbf;border-color:#0f6cbf}
.atu .ock.ok{background:#d7efd8}.atu .ock.no{background:#f6d6d2}.atu .ock.miss{background:#fcefdc;border:0}
.atu .ock.ok .b,.atu .ock.no .b{background:#0f6cbf;border-color:#0f6cbf}
.atu .aout{margin-top:10px;background:#fcefdc;color:#7d5a29;border-radius:4px;padding:8px 10px;font-size:13px}
.atu .abt{display:flex;justify-content:space-between;gap:8px;margin:14px 12px 0}
.atu .abt button{font:inherit;font-size:14px;border:0;border-radius:4px;padding:9px 14px;background:#ced4da;color:#1d2125;cursor:pointer}
.atu .abt button.p{background:#0f6cbf;color:#fff}
.atu .abt.col{flex-direction:column}
.atu .ah{font-size:18px;font-weight:700;margin:14px 12px 6px}
.atu .atb{margin:0 12px;border:1px solid #dee2e6;border-radius:4px;overflow:hidden}
.atu .atb .th,.atu .atb button{display:flex;gap:10px;width:100%;padding:8px 10px;font:inherit;font-size:13.5px;text-align:left;background:#fff;border:0;border-top:1px solid #dee2e6;color:#1d2125;cursor:pointer}
.atu .atb .th{font-weight:700;border-top:0;background:#f8f9fa;cursor:default}
.atu .atb span:first-child{width:52px;flex:none}.atu .atb button span:first-child{color:#0f6cbf}
.atu .ares{margin:12px 12px 0;border:1px solid #dee2e6;border-radius:4px;overflow:hidden}
.atu .ares div{display:flex;justify-content:space-between;padding:8px 10px;font-size:13.5px;border-top:1px solid #dee2e6}.atu .ares div:first-child{border-top:0}
.atu .ares span{color:#4c5a63}.atu .ares .big b{font-size:16px}
.atog>span:first-child{text-align:left}
.tfb.pt{background:color-mix(in srgb,#e8a23a 16%,transparent);color:#b0700f}[data-theme=dark] .tfb.pt{color:#f0b860}
/* şekilli sorular */
.qimg{position:relative;margin-top:10px;background:#fff;border-radius:14px;overflow:hidden;display:flex;justify-content:center;cursor:zoom-in;box-shadow:var(--sh)}
.qimg img{display:block;max-width:100%;max-height:300px;object-fit:contain}
.qimg .zm,.aimg .zm{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 7px;border-radius:8px;pointer-events:none}
.atu .aimg{position:relative;background:#fff;border:1px solid #cfd8dc;margin:8px 0 6px;display:flex;justify-content:center;cursor:zoom-in}
.atu .aimg img{display:block;max-width:100%;max-height:320px;object-fit:contain}
.card.fneed{box-shadow:inset 0 0 0 2px #e8a23a,var(--sh)}
.fstep{display:flex;align-items:center;gap:14px}.fstep b{font-size:17px;min-width:60px;text-align:center}.fstep .btn{width:44px;padding:8px 0;font-size:18px}
.frow{display:flex;gap:8px;align-items:center;margin-top:8px}.frow input{flex:1;min-width:0}.frow select{width:76px;flex:none}
.fnums{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.fnums button,.fnums span{width:44px;height:44px;border-radius:12px;background:var(--soft);border:2px solid transparent;font:inherit;font-weight:800;font-size:16px;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fnums .on{border-color:#2fbf71;background:color-mix(in srgb,#2fbf71 18%,var(--card));color:#1f9e5a}[data-theme=dark] .fnums .on{color:#6fe0a0}
.fnums.sm span{width:34px;height:34px;font-size:14px;border-radius:10px;cursor:default}
#zov{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column}
#zov .zsc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;touch-action:pan-x pan-y}
#zov .zsc img{width:100%;max-width:none;margin:auto;display:block;background:#fff}
#zov .zbt{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;display:flex;gap:8px}
#zov .zbt button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
#zov .zh{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;color:#bbb;font-size:12.5px;pointer-events:none}

</style>

// Bir derste ders/muhazire var mı: programda olması YA DA hakkı girilmiş olması YA DA "bitti" işareti YA DA kayıt olması yeterli
// (muhazireler bitip programdan çıkarılsa bile eski muhazire hakkı ve kayıtları kaybolmasın)
function HAS(){const h={};C().order.forEach(k=>h[k]={d:false,m:false});Object.values(C().sch).forEach(day=>day.forEach(sl=>sl.o.forEach(o=>{if(h[o[0]])h[o[0]][o[1]]=true})));
  const Lm=L(),Dn=DONE();Object.keys(h).forEach(k=>{const x=Lm[k]||{};if(x.d>0)h[k].d=true;if(x.m>0||Dn[k])h[k].m=true});
  try{absAll().forEach(a=>{if(h[a.s]&&(a.k==="d"||a.k==="m"))h[a.s][a.k]=true})}catch(_){}
  return h}
function st(used,tot){
  if(!tot)return{c:"none",t:"Hak girilmedi"};
  const left=tot-used;
  if(left<0)return{c:"over",t:"Kesildin · hakkı "+f(-left)+" ders aştın",short:"Kesildin"};
  if(left===0)return{c:"edge",t:"Limittesin · bir daha kaçırırsan kesilirsin",short:"Limittesin"};
  if(used>0&&(left<=2||used/tot>=.75))return{c:"warn",t:f(left)+" ders hak kaldı · dikkat",short:f(left)+" ders kaldı"};
  return{c:"ok",t:f(left)+" ders hak kaldı",short:f(left)+" ders kaldı"};
}
const RANK={over:4,edge:3,warn:2,ok:1,none:0};
function calc(s,list){
  let d=0,m=0;list.forEach(a=>{if(a.s!==s)return;if(a.k==="d")d+=u(a);else m+=u(a)});
  // Kural: muhazire hakkı derste kullanılabilir, ders hakkı muhazirede kullanılamaz (ortak havuz = kalan muhazire hakkı)
  const H=HAS()[s]||{d:true,m:false},Lm=L()[s]||{},lD=H.d?(Lm.d||0):0,lM=H.m?(Lm.m||0):0,rows=[];
  const ex=H.d&&H.m?Math.max(0,Math.min(d-lD,Math.max(0,lM-m))):0; // muhazire hakkından derse kullanılan
  const exAll=H.d&&H.m?Math.max(0,d-lD):0;
  if(H.d)rows.push({k:"d",used:d,tot:lD?(lD+(H.m?Math.max(0,lM-m):0)):(H.m&&lM?lM-m>0?lM-m:0:0),lim:lD});
  if(H.m)rows.push({k:"m",used:m+exAll,tot:lM,own:m,lim:lM});
  if(!rows.length)rows.push({k:"d",used:d,tot:Lm.d||0,lim:Lm.d||0});
  rows.forEach(r=>r.st=st(r.used,r.tot));
  const done=!!DONE()[s];
  // muhazireler bittiyse artık muhazire kaçırılamaz: limitte/dikkat sayılmaz (aşıldıysa kesildi kalır)
  if(done)rows.forEach(r=>{if(r.k==="m"&&r.st.c!=="over"&&r.st.c!=="none")r.st={c:"ok",t:"Muhazireler bitti",short:"Bitti"}});
  const worst=rows.reduce((w,r)=>RANK[r.st.c]>RANK[w.st.c]?r:w,rows[0]);
  const T=lD+lM||rows[0].tot,left=T?Math.max(0,lD-Math.min(d,lD))+(lM-m-exAll):null;
  return{s,n:d+m,d,m,lD,lM,ex,exAll,rows,worst,carry:0,T,left,done};
}
function summary(list){
  const items=C().order.map(s=>calc(s,list));
  let used=0,tot=0,usedL=0;const cnt={over:0,edge:0,warn:0,ok:0,none:0};
  let left=0;items.forEach(c=>{used+=c.n;if(c.T){tot+=c.T;usedL+=c.n;left+=Math.max(0,c.left)}cnt[c.worst.st.c]++});
  items.sort((a,b)=>{const r=RANK[b.worst.st.c]-RANK[a.worst.st.c];if(r)return r;const pa=a.worst.tot?a.worst.used/a.worst.tot:0,pb=b.worst.tot?b.worst.used/b.worst.tot:0;return pb-pa||b.n-a.n});
  return{items,used,tot,usedL,left,cnt,worst:items.length?items[0].worst.st.c:"none"};
}

function slotsFor(d){
  const wd=parse(d).getDay();
  const base=(C().sch[wd]||[]).map(sl=>Object.assign(clone(sl),{key:sl.t}));
  changes.filter(c=>c.d===d).forEach(c=>{
    if(c.kind==="ekstra"){base.push({t:c.nt||"",l:sname(c.s)+(c.not?"":""),o:[[c.s,c.k||"d"]],key:"x"+(c.nt||""),extra:true,note:c.not,cid:c.id});return}
    const sl=base.find(x=>x.t===c.t);if(!sl)return;
    sl.cid=c.id;
    if(c.kind==="iptal"){sl.cancel=true;sl.note=c.not}
    else if(c.kind==="saat"){sl.newT=c.nt;sl.note=c.not}
    else sl.note=c.not;
  });
  return base.sort((a,b)=>tm(a.newT||a.t)-tm(b.newT||b.t));
}

function sum3(list,src){const S=summary(list),dk=S.cnt.over+S.cnt.edge+S.cnt.warn,bt=(v,inner)=>src?'<button data-a="abssum" data-v="'+v+'" data-src="'+src+'">'+inner+'</button>':'<div>'+inner+'</div>';return'<div class="sum3">'+bt("n",'<b>'+f(S.used)+'</b><small>KAÇIRILAN DERS</small>')+bt("left",'<b style="color:var(--grn)">'+(S.tot?f(S.left):"–")+'</b><small>KALAN HAK</small>')+bt("risk",'<b style="color:'+(S.cnt.over?"var(--dred)":(dk?"var(--org)":"var(--grn)"))+'">'+(S.cnt.over?S.cnt.over:dk)+'</b><small>'+(S.cnt.over?"KESİLDİ":"DİKKAT")+'</small>')+'</div>'+(S.tot?'':'<p class="muted" style="margin:8px 4px 0">Haklar henüz girilmedi.'+(can("hak")?' <button class="lnk" data-a="go" data-v="hakedit">Hakları gir ›</button>':'')+'</p>')}
function detCards(list,own){
  const S=summary(list),LB={over:"Kesildi",edge:"Limitte",warn:"Dikkat",ok:"Rahat",none:"Hak yok"};
  const rest=S.items.filter(c=>!c.T&&!c.n);
  return S.items.filter(c=>c.T||c.n).map(c=>{
    const stc=c.worst.st.c,ent=list.filter(a=>a.s===c.s).sort((a,b)=>a.d<b.d?-1:1);
    const bar=(lab,used,lim,op)=>'<div class="bl"><div class="lb"><span>'+lab+'</span><span>'+f(used)+(lim?' / '+f(lim):'')+' kullanıldı</span></div><div class="bb"><i style="width:'+(lim?Math.min(100,used/lim*100):(used?100:0))+'%;'+(op?"opacity:.55":"")+'"></i></div></div>';
    let h='<div class="sc" id="sc_'+c.s+'" style="'+col(c.s)+'"><div class="hd"><b>'+esc(sname(c.s))+'</b><span class="chip '+stc+'">'+LB[stc]+'</span></div>';
    const H=HAS()[c.s]||{d:true,m:false};
    if(H.d)h+=bar("Ders",c.d,c.lD);
    if(H.m)h+=bar(c.done?"Muhazire · bitti ✓":"Muhazire",c.m+(H.d?c.exAll:0),c.lM,true);
    let info="";
    if(!c.T)info=c.n?f(c.n)+" ders kaçırıldı · haklar girilmedi":"Haklar girilmedi";
    else{
      const r0=c.rows.find(r=>r.k==="d"),rm=c.rows.find(r=>r.k==="m");
      if(H.d&&H.m&&c.exAll>0)info+=(own?"Ders hakkın bitti, ":"Ders hakkı bitti, ")+'<b>'+f(c.exAll)+' ders</b> muhazire hakkından kullanıldı.<br>';
      if(stc==="over")info+=(rm&&rm.st.c==="over"&&c.m>c.lM?"Muhazire hakkı aşıldı":"Hak aşıldı")+' · <b>kesildi</b>';
      else if(H.d&&H.m&&c.done){const lm=Math.max(0,c.lM-c.m-c.exAll),ld=Math.max(0,c.lD-c.d)+lm;info+='Muhazireler bitti ✓ · Kalan: derse <b>'+f(ld)+'</b>'+(lm?' ('+f(ld-lm)+' ders + '+f(lm)+' muhazireden)':'')}
      else if(H.d&&H.m){const lm=Math.max(0,c.lM-c.m-c.exAll),ld=Math.max(0,c.lD-c.d)+lm;info+='Kalan: derse <b>'+f(ld)+'</b>'+(lm&&ld!==lm?' ('+f(ld-lm)+' ders + '+f(lm)+' muhazireden)':'')+' · muhazireye <b>'+f(lm)+'</b>'+(lm&&ld>0&&c.lD-c.d<=0?' (ikisi ortak)':'')}
      else info+='Kalan: <b>'+f(Math.max(0,(r0||rm).tot-(r0||rm).used))+'</b> ders';
      if(stc==="edge")info+='<br><b style="color:var(--red)">'+(own?"Bir daha kaçırırsan kesilirsin":"Bir daha kaçırırsa kesilir")+'</b>';
    }
    h+='<div class="info">'+info+'</div>';
    if(ent.length)h+='<div class="dts">'+ent.map(a=>'<span class="'+(a.k==="m"?"m":"")+'">'+esc(parse(a.d).toLocaleDateString("tr-TR",{day:"numeric",month:"short"}))+' · '+(a.k==="m"?"M · ":"")+esc(pl(a))+'</span>').join("")+'</div>';
    return h+'</div>';
  }).join("")+(rest.length?'<div class="snote" style="margin-top:10px">Hakkı girilmemiş dersler: '+rest.map(c=>esc(sname(c.s))).join(", ")+'</div>':'')+'<div class="snote" style="margin-top:12px;background:color-mix(in srgb,var(--acc) 10%,var(--card))">ℹ️ Muhazire hakkı normal derste de kullanılabilir, ama ders hakkı muhazirede kullanılamaz.</div>';
}

function lessons(d){const w=parse(d).getDay();return(w>=1&&w<=5)?slotsFor(d).filter(x=>!x.cancel):[]}
function ykLessons(d){
  const L=lessons(d).slice(),keys=new Set(L.map(x=>x.key));
  jurAll.filter(x=>x.d===d&&(x.sem||"")===semId()&&!keys.has(x.key)).forEach(x=>{keys.add(x.key);L.push({key:x.key,t:x.t||String(x.key).replace(/^x/,""),l:sname(x.s),o:[[x.s,x.k||"d"]],extra:true})});
  if(yk&&yk.extra&&yk.d===d&&!keys.has(yk.extra.key))L.push(yk.extra);
  return L.sort((a,b)=>tm(a.newT||a.t)-tm(b.newT||b.t));
}

/* ---------- test: PDF'ten soru ayıklama ---------- */
function parseTest(txt){
  const L=txt.replace(/\r/g,"").replace(/[—–-]\s*kitap s\.[^—–\n]*[—–]/gi,"\n").split("\n").map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const secs=[],qs=[];let cur=null,sec=-1,bad=0,noAns=0,pend=null;
  const isHead=l=>l.length>=10&&!/^\d/.test(l)&&/[A-ZƏÜÖĞŞÇİ]/.test(l)&&!/[a-zəüöğışç]/.test(l)&&!/^[A-F][.)]/.test(l);
  const fin=()=>{if(!cur)return;const k=cur.o.length,okN=cur.o.filter(o=>o.ok).length,ai=cur.o.findIndex(o=>o.ok);
    if(k>=2&&okN===1){const x={n:cur.n,q:cur.q.trim(),st:cur.st,o:cur.o.map(o=>o.t.trim()),a:ai,u:!!cur.o[ai].u,sec:Math.max(0,sec)};if(cur.img!=null)x.img=cur.img;qs.push(x)}
    else if(k>=2&&okN===0)noAns++;else bad++;cur=null};
  for(const l of L){
    const im=l.match(/^⟦IMG(\d+)⟧$/);if(im){if(cur&&!cur.o.length&&cur.img==null)cur.img=+im[1];else pend=+im[1];continue}
    if(/^\d{1,4}$/.test(l))continue;
    if(/^—.*—$/.test(l)||/^(Seçim|Uyğunluq|Açıq|Ardıcıllıq)$/i.test(l))continue;
    if(isHead(l)){fin();secs.push(l.replace(/\s*[.]\s*$/,""));sec=secs.length-1;continue}
    let m=l.match(/^([A-F])\s*[.)]\s*(.*)$/);
    if(!m&&cur&&cur.o.length&&cur.o.length<6){const z=l.match(/^([A-F])\s+(\S.*)$/);if(z&&z[1]==="ABCDEF"[cur.o.length])m=z}
    if(m&&cur&&(cur.o.length||cur.q)){let t=m[2];const ok=/[✓✔]/.test(t),u=/\(\?\)/.test(t);t=t.replace(/[✓✔]/g,"").replace(/\(\?\)/g,"").trim();cur.o.push({t,ok,u});continue}
    m=l.match(/^(\d{1,4})[.)]\s+(.*)$/)||l.match(/^(\d{1,4})[.)]([^\d\s.,].*)$/);
    if(!m&&cur&&cur.o.length>=2){const z=l.match(/^(\d{1,4})\s+(\S.*)$/);if(z&&+z[1]===cur.n+1)m=z}
    if(m){const n=+m[1];if(cur&&!cur.o.length&&cur.q&&n===cur.stn+1&&n<=12){cur.st.push(m[2]);cur.stn=n;continue}fin();cur={n,q:m[2],st:[],stn:0,o:[]};if(pend!=null){cur.img=pend;pend=null}continue}
    m=l.match(/^([a-h])\)\s*(.*)$/);
    if(m&&cur&&!cur.o.length){cur.st.push(m[1]+") "+m[2]);continue}
    if(!cur||/^Not:/i.test(l))continue;
    if(cur.o.length){const o=cur.o[cur.o.length-1];if(/[✓✔]/.test(l))o.ok=true;if(/\(\?\)/.test(l))o.u=true;o.t+=" "+l.replace(/[✓✔]/g,"").replace(/\(\?\)/g,"").trim()}
    else if(cur.st.length)cur.st[cur.st.length-1]+=" "+l;else cur.q+=" "+l;
  }
  fin();return{secs,qs,bad,noAns};
}
async function pdfText(blob,onp){
  const lib=await pdfjs();const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;let txt="";
  for(let p=1;p<=doc.numPages;p++){if(onp&&p%5===1)onp("Sorular okunuyor… "+p+" / "+doc.numPages);const pg=await doc.getPage(p);const tc=await pg.getTextContent();tc.items.forEach(it=>{txt+=it.str+(it.hasEOL?"\n":"")});txt+="\n"}
  try{doc.destroy()}catch(_){}return txt;
}

function tPool(tid,k){const d=tData[tid];if(!d)return[];const P=d._pool||(d._pool={});if(P[k])return P[k];const out=[];
  d.qs.forEach(q=>{if(q.k==="m"&&k==="m")q.it.forEach(x=>out.push({t:x.t,a:x.a}));if(q.k==="f"&&k==="f")q.bl.forEach(a=>out.push({t:"",a}))});return P[k]=out}

  const A=[];qAns(q).forEach(a=>{if(!A.some(x=>tnorm(x)===tnorm(a)))A.push(a)});
  const terms=q.k==="m"?q.it.map(x=>tnorm(x.t)):[],want=Math.max(5,A.length+3)-A.length,pick=[];
  const tryAdd=list=>{shuffle(list.slice()).forEach(c=>{if(pick.length>=want)return;if(terms.includes(tnorm(c.t)))return;if(A.some(a=>tsim(a,c.a))||pick.some(a=>tsim(a,c.a)))return;if(c.a.length>120)return;pick.push(c.a)})};
  tryAdd(tPool(tid,q.k));if(pick.length<want)tryAdd(tPool(tid,q.k==="m"?"f":"m"));
  return shuffle(A.concat(pick));
}

      const r=src.im.naturalHeight/src.im.naturalWidth,c=document.createElement("canvas");c.width=W;c.height=Math.min(Math.round(W*r),Math.round(W*1.5));const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(src.im,0,0,W,Math.round(W*r));URL.revokeObjectURL(src.u);return c.toDataURL("image/jpeg",.72)}
    if(!/pdf/i.test(type||bl.type))return"";
    const lib=await pdfjs();const doc=await lib.getDocument({data:new Uint8Array(await bl.arrayBuffer())}).promise;const pg=await doc.getPage(1);
    const v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:W/v0.width});const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.min(Math.round(vp.height),Math.round(W*1.5));
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:vp}).promise;try{doc.destroy()}catch(_){}
    const u=c.toDataURL("image/jpeg",.7);return u.length<60000?u:c.toDataURL("image/jpeg",.45);
  }catch(e){console.warn("önizleme",e);return""}
}

function onPend(n,boot){
  const before=me?pendBar():"";const was=pendN2+(pendBoot?1:0);pendN2=n;if(boot!=null)pendBoot=boot;
  const now=pendN2+(pendBoot?1:0);
  if(now>0&&!pendSince){pendSince=Date.now();setTimeout(()=>{if(me&&pendBar()!==before)try{render()}catch(_){}},1700)}

function absSumSheet(kind,list){
  const S=summary(list),CL={over:"var(--dred)",edge:"var(--red)",warn:"var(--org)",ok:"var(--grn)",none:"var(--mut2)"},LB={over:"Kesildi",edge:"Limitte",warn:"Dikkat",ok:"Rahat",none:"Hak yok"};
  let it=S.items.slice(),h='';
  if(kind==="n"){it=it.filter(c=>c.n).sort((a,b)=>b.n-a.n);h+='<h2>Kaçırılan dersler · '+f(S.used)+'</h2>';if(!it.length)h+='<div class="empty">Hiç devamsızlık yok 👍</div>';
    it.forEach(c=>{const ent=list.filter(a=>a.s===c.s);h+='<button class="r2" data-a="absjump" data-v="'+c.s+'" style="'+col(c.s)+'"><span class="dot"></span><span class="w"><b>'+esc(sname(c.s))+'</b><small>'+(c.d?"Ders "+f(c.d):"")+(c.d&&c.m?" · ":"")+(c.m?"Muhazire "+f(c.m):"")+' · '+ent.length+' kayıt</small></span><span class="v" style="font-weight:800">'+f(c.n)+'</span></button>'})}
  else if(kind==="left"){it=it.filter(c=>c.T).sort((a,b)=>a.left-b.left);h+='<h2>Kalan haklar · '+f(S.left)+'</h2>';if(!it.length)h+='<div class="empty">Haklar henüz girilmedi</div>';
    it.forEach(c=>{const H=HAS()[c.s]||{},lm=Math.max(0,c.lM-c.m-c.exAll),ld=Math.max(0,c.lD-c.d)+lm,cr=CL[c.worst.st.c];h+='<button class="r2" data-a="absjump" data-v="'+c.s+'" style="'+col(c.s)+'"><span class="dot"></span><span class="w"><b>'+esc(sname(c.s))+'</b><small>'+(H.d&&H.m?'derse '+f(ld)+' · muhazireye '+(c.done?"bitti":f(lm)):'')+'</small></span><span class="v" style="font-weight:800;color:'+cr+'">'+f(Math.max(0,c.left))+'</span></button>'})}
  else{it=it.filter(c=>["over","edge","warn"].includes(c.worst.st.c));h+='<h2>Dikkat gereken dersler</h2>';if(!it.length)h+='<div class="empty">Hepsi rahat 👍</div>';
    it.forEach(c=>{const st=c.worst.st.c,rm=c.rows.find(r=>r.k==="m"),why=st==="over"?(rm&&c.m>c.lM?"Muhazire hakkı aşıldı":"Hak aşıldı"):(st==="edge"?(c.worst.k==="m"?"Muhazire hakkı bitti · bir daha muhazireye gelmezsen kesilirsin":"Ders hakkı bitti · bir daha kaçırırsan kesilirsin"):c.worst.st.t);
      h+='<button class="r2" data-a="absjump" data-v="'+c.s+'" style="'+col(c.s)+'"><span class="dot" style="background:'+CL[st]+'"></span><span class="w"><b>'+esc(sname(c.s))+'</b><small>'+esc(why)+'</small></span><span class="chip '+st+'">'+LB[st]+'</span></button>'})}
  return h.replace(/^<h2>/,'<h2 style="margin-bottom:10px">').replace(/(<\/h2>)/,'$1<div class="list">')+'</div>';
}

  unsubPerm.push(canRaw("sinav")?B.watchCol("pexams",d=>{exP=d;refilter();render()}):B.watchCol("pexams",d=>{exP=d;refilter();render()},["uids","array-contains",me.uid]));
}
async function start(){
  try{B=MOCK?mockBackend():await firebaseBackend()}catch(e){$app.innerHTML='<div class="center"><div class="em">📡</div><h1>Bağlanamadı</h1><p>İnternet bağlantını kontrol edip sayfayı yenile.</p></div>';return}
  me=undefined;render();
  B.onAuth(user=>{
    stopAll();lastPermKey="";
    me=user;member=null;roles={};cls=null;hak=null;anns=[];exams=[];changes=[];hws=[];subsList=[];members=[];users=[];prof=null;route={v:"home"};stack=[];statusMsg="";
    profLoaded=false;profSrv=null;bakList=null;bakFor="";cfg=null;vSem=null;jurAll=[];jentAll=[];jmeta=null;libShared=[];libMine=[];yk=null;exA=[];exP=[];examsAll=[];changesAll=[];hwsAll=[];subsAll=[];absTab="mine";kutTab="not";kutS="";kutQ="";sheet=null;foldShared=[];foldMine=[];testsShared=[];testsMine=[];tData={};tNew=null;tRun=null;tBusy="";kulStop();kulData=null;closeSearch();trk.sid=null;polls=[];votes=[];svotes=[];usage=null;topics=[];claims=[];odevTab="konu";tpOpen=new Set();
    if(!user){loginMode="in";loginErr="";loginOk="";render();return}
    isDevReal=MOCK?/^dev/.test(user.email):DEV_EMAILS.map(x=>x.toLowerCase()).includes(user.email);applyAdmin();
    if(isDevReal)startData();
    unsubAll.push(B.watchDoc("members/"+user.uid,async d=>{
      if(!d){try{await B.set("members/"+user.uid,{name:user.name||user.email.split("@")[0],email:user.email,status:isDevReal?"approved":"pending",at:Date.now()})}catch(e){console.warn(e)}return}
      member=d;if(approved())startData();render();
    }));
    const onRoles=()=>{if(dataStarted)permSubs();render()};
    if(isDevReal)unsubAll.push(B.watchCol("roles",d=>{roles={};d.forEach(x=>roles[x.id]=x);onRoles()}));
    else unsubAll.push(B.watchDoc("roles/"+user.uid,d=>{roles={};if(d)roles[user.uid]=d;onRoles()}));
    render();
  });
  setInterval(()=>{if(me&&route.v==="home")render()},60000);
}
start();
