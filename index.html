.setup{max-width:520px;margin:0 auto;padding:40px 20px}

const PALETTE = [["Mavi","#3f6fd8"],["Mor","#8a4fd1"],["Turuncu","#d9891a"],["Turkuaz","#1a9b93"],["Kırmızı","#d4513f"],["Kiremit","#b0563f"],["Yeşil","#2e9a5e"],["Pembe","#c9467f"],["Gri","#6b7486"],["Lacivert","#2c3e8f"],["Zeytin","#7a8a2a"],["Kahve","#8a5a3a"]];

/* ============================================================
   BACKEND
   ============================================================ */
async function firebaseBackend(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const A = await import(base+"firebase-app.js");
  const Au = await import(base+"firebase-auth.js");
  const F = await import(base+"firebase-firestore.js");
  const app = A.initializeApp(firebaseConfig);
  const auth = Au.getAuth(app);
  const db = F.getFirestore(app);
  const map = u => u && {uid:u.uid, email:u.email||"", name:u.displayName||"", verified:u.emailVerified};
  return {
    onAuth: cb => Au.onAuthStateChanged(auth, u => cb(map(u))),
    google: async () => { const p = new Au.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); return Au.signInWithPopup(auth, p); },
    emailIn: (e,p) => Au.signInWithEmailAndPassword(auth, e, p),
    emailUp: async (e,p,n) => { const c = await Au.createUserWithEmailAndPassword(auth, e, p); await Au.updateProfile(c.user,{displayName:n}); try{await Au.sendEmailVerification(c.user)}catch(_){} return c; },
    reset: e => Au.sendPasswordResetEmail(auth, e),
    out: () => Au.signOut(auth),
    watchClass: (cb,er) => F.onSnapshot(F.doc(db,"class","main"), s => cb(s.exists()?s.data():null), er),
    saveClass: d => F.setDoc(F.doc(db,"class","main"), d),
    watchAnn: (cb,er) => F.onSnapshot(F.query(F.collection(db,"announcements"), F.orderBy("at","desc"), F.limit(50)), s => cb(s.docs.map(d=>({id:d.id,...d.data()}))), er),
    addAnn: (text,by) => F.addDoc(F.collection(db,"announcements"), {text, by, at:Date.now()}),
    delAnn: id => F.deleteDoc(F.doc(db,"announcements",id)),
    watchMe: (uid,cb,er) => F.onSnapshot(F.doc(db,"users",uid), s => cb(s.exists()?s.data():null), er),
    saveMe: (uid,d) => F.setDoc(F.doc(db,"users",uid), d, {merge:true}),
    listUsers: async () => { const s = await F.getDocs(F.collection(db,"users")); return s.docs.map(d=>({uid:d.id,...d.data()})); },
    watchRoles: (cb,er) => F.onSnapshot(F.collection(db,"roles"), s => { const r={}; s.docs.forEach(d=>r[d.id]=d.data()); cb(r); }, er),
    setRole: (uid,on) => on ? F.setDoc(F.doc(db,"roles",uid),{admin:true,at:Date.now()}) : F.deleteDoc(F.doc(db,"roles",uid))
  };
}
/* Test modu: ?mock — veriler sadece bu tarayıcıda; e-postası "baskan" ile başlayan kişi yönetici sayılır */
function mockBackend(){
  const KEY="mockdb"; let D; try{D=JSON.parse(localStorage.getItem(KEY))}catch(_){} D=D||{users:{},ann:[],cls:null,accounts:{},cur:null};
  const subs={auth:[],cls:[],ann:[],me:{}}; const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(_){}};
  const who=()=>D.cur&&D.accounts[D.cur]; const dev=()=>{const w=who();return !!(w&&/^dev/.test(w.email))};
  const admin=()=>{const w=who();return !!(w&&(dev()||/^baskan/.test(w.email)||(D.roles&&D.roles[w.uid])))};
  const fire=()=>{subs.auth.forEach(f=>f(who()&&{uid:who().uid,email:who().email,name:who().name,verified:true}));};
  const tick=f=>setTimeout(f,30);
  return {
    onAuth: cb => { subs.auth.push(cb); tick(()=>cb(who()&&{uid:who().uid,email:who().email,name:who().name,verified:true})); return()=>{}; },
    google: async()=>{ throw {code:"mock/no-google"} },
    emailIn: async(e,p)=>{ const a=D.accounts[e]; if(!a||a.p!==p) throw {code:"auth/invalid-credential"}; D.cur=e; persist(); fire(); },
    emailUp: async(e,p,n)=>{ if(D.accounts[e]) throw {code:"auth/email-already-in-use"}; if(p.length<6) throw {code:"auth/weak-password"}; D.accounts[e]={uid:"u"+Date.now().toString(36),email:e,p,name:n}; D.cur=e; persist(); fire(); },
    reset: async()=>{},
    out: async()=>{ D.cur=null; persist(); fire(); },
    watchClass: cb => { subs.cls.push(cb); tick(()=>cb(D.cls)); return()=>{}; },
    saveClass: async d => { if(!admin()) throw {code:"permission-denied"}; D.cls=JSON.parse(JSON.stringify(d)); persist(); subs.cls.forEach(f=>f(D.cls)); },
    watchAnn: cb => { subs.ann.push(cb); tick(()=>cb(D.ann.slice().sort((a,b)=>b.at-a.at))); return()=>{}; },
    addAnn: async(text,by)=>{ if(!admin()) throw {code:"permission-denied"}; D.ann.push({id:"a"+Date.now(),text,by,at:Date.now()}); persist(); subs.ann.forEach(f=>f(D.ann.slice().sort((a,b)=>b.at-a.at))); },
    delAnn: async id=>{ if(!admin()) throw {code:"permission-denied"}; D.ann=D.ann.filter(a=>a.id!==id); persist(); subs.ann.forEach(f=>f(D.ann.slice().sort((a,b)=>b.at-a.at))); },

/* ---------- Hesaplama ---------- */
function HAS(){const h={};C().order.forEach(k=>h[k]={d:false,m:false});Object.values(C().sch).forEach(day=>day.forEach(sl=>sl.o.forEach(o=>{if(h[o[0]])h[o[0]][o[1]]=true})));return h}
function lims(s){const v=C().lim&&C().lim[s];return v||{}}
function st(used,tot){
  if(!tot)return{c:"none",t:"Hak girilmedi"};
  const left=tot-used;
  if(left<0)return{c:"over",t:"Kesildin · hakkı "+f(-left)+" ders aştın",short:"Kesildin"};
  if(left===0)return{c:"edge",t:"Limittesin · bir daha kaçırırsan kesilirsin",short:"Limittesin"};
  if(used>0&&(left<=2||used/tot>=.75))return{c:"warn",t:f(left)+" ders hak kaldı · dikkat",short:f(left)+" ders kaldı"};
  return{c:"ok",t:f(left)+" ders hak kaldı",short:f(left)+" ders kaldı"};
}
const RANK={over:4,edge:3,warn:2,ok:1,none:0};
function calc(s,list){
  let d=0,m=0;list.forEach(a=>{if(a.s!==s)return;if(a.k==="d")d+=u(a);else m+=u(a)});
  const H=HAS()[s]||{d:true,m:false},L=lims(s),done=!!(C().done&&C().done[s]);
  const carry=(H.d&&H.m&&done&&L.m)?Math.max(0,L.m-m):0,rows=[];
  if(H.d)rows.push({k:"d",used:d,tot:(L.d||0)+carry,carry});
  if(H.m&&!(H.d&&done))rows.push({k:"m",used:m,tot:L.m||0,carry:0});
  if(!rows.length)rows.push({k:"d",used:d,tot:L.d||0,carry:0});
  rows.forEach(r=>r.st=st(r.used,r.tot));
  const worst=rows.reduce((w,r)=>RANK[r.st.c]>RANK[w.st.c]?r:w,rows[0]);
  return{s,n:d+m,rows,worst,done,carry,H};
}
function summary(list){
  const items=C().order.map(s=>calc(s,list));
  let used=0,tot=0,usedL=0;const cnt={over:0,edge:0,warn:0,ok:0,none:0};
  items.forEach(c=>{used+=c.n;c.rows.forEach(r=>{if(r.tot){tot+=r.tot;usedL+=r.used}});cnt[c.worst.st.c]++});
  items.sort((a,b)=>{const r=RANK[b.worst.st.c]-RANK[a.worst.st.c];if(r)return r;const pa=a.worst.tot?a.worst.used/a.worst.tot:0,pb=b.worst.tot?b.worst.used/b.worst.tot:0;return pb-pa||b.n-a.n});
  const worst=items.length?items[0].worst.st.c:"none";
  return{items,used,tot,usedL,cnt,worst};
}

  s.forEach(a=>h+='<div class="hi" style="'+col(a.s)+'"><span class="dt"></span><div class="w">'+esc(sname(a.s))+' <span style="color:#8a8f9c">· '+TY[a.k]+' · '+pl(a)+'</span><small>'+esc(fmt(a.d,{day:"numeric",month:"long",weekday:"short"}))+' · '+esc(a.t)+'</small></div>'+(editable?'<button class="del" data-a="del" data-id="'+a.id+'" aria-label="Sil">×</button>':'')+'</div>');
  return h+'</div>';
}

function annView(){
  let h='';
  if(isAdmin)h+='<h2>Duyuru paylaş</h2><div class="panel"><form data-form="ann"><textarea name="t" placeholder="Örn. Yarın biokimya dersi 10.30\'da başlayacak." required></textarea><button class="btn dark full" style="margin-top:10px" type="submit">Paylaş</button></form>'+(adminMsg?'<div class="ok">'+esc(adminMsg)+'</div>':'')+'</div>';
  h+='<h2>Duyurular</h2>';
  const seen=lastSeenAnn();
  if(!anns.length)h+='<div class="panel"><div class="empty">Henüz duyuru yok.</div></div>';
  anns.forEach(a=>h+='<div class="ann'+(a.at>seen?' new':'')+'"><p>'+esc(a.text)+'</p><div class="meta"><span>'+esc(a.by||"Sınıf başkanı")+' · '+esc(timeAgo(a.at))+'</span>'+(isAdmin?'<button class="link" style="color:#c23b3b" data-a="delann" data-id="'+a.id+'">Sil</button>':'')+'</div></div>');
  return h;
}

function sinifView(){
  if(!isAdmin)return'<div class="panel"><div class="empty">Bu bölüm sadece başkan için.</div></div>';
  let h='<h2>Sınıf <span>· herkesin durumu</span></h2>';
  if(usersErr)return h+'<div class="panel"><div class="err">'+esc(usersErr)+'</div></div>';
  if(!users)return h+'<div class="panel"><div class="empty">Yükleniyor…</div></div>';
  const rows=users.map(x=>({x,S:summary(x.abs||[])})).sort((a,b)=>RANK[b.S.worst]-RANK[a.S.worst]||b.S.used-a.S.used);
  const cnt={over:0,edge:0};rows.forEach(r=>{if(r.S.cnt.over)cnt.over++;else if(r.S.cnt.edge)cnt.edge++});
  h+='<div class="panel" style="margin-bottom:10px"><div class="chips" style="margin:0"><span class="chip none">'+users.length+' kişi</span>'+(cnt.over?'<span class="chip over">'+cnt.over+' kişi kesildi</span>':'')+(cnt.edge?'<span class="chip edge">'+cnt.edge+' kişi limitte</span>':'')+'</div></div>';
  h+='<div class="list">';
  if(!rows.length)h+='<div class="empty">Henüz kimse kayıt olmadı.</div>';
  rows.forEach(r=>{
    const lab={over:"Kesildi",edge:"Limitte",warn:"Dikkat",ok:"Rahat",none:"—"}[r.S.worst];
    h+='<div class="ul" data-a="uye" data-id="'+esc(r.x.uid)+'"><div class="av">'+esc(initials(r.x.name||r.x.email))+'</div><div class="w"><b>'+esc(r.x.name||r.x.email||"İsimsiz")+(roles[r.x.uid]?' <span class="badge">Başkan</span>':'')+'</b><small>'+esc(r.x.email||"")+'</small></div><div style="text-align:right"><div class="n">'+f(r.S.used)+'</div>'+(r.S.worst!=="none"?'<span class="chip '+r.S.worst+'">'+lab+'</span>':'')+'</div></div>';
  });
  h+='</div><button class="btn line full" style="margin-top:12px" data-a="refresh">Listeyi yenile</button>';
  return h;
}
function uyeView(){
  const x=users&&users.find(y=>y.uid===viewing);
  if(!x)return'<button class="back" data-a="go" data-v="sinif">‹ Sınıf</button><div class="panel"><div class="empty">Bulunamadı.</div></div>';
  let rt='';
  if(isDev&&x.uid!==me.uid){const on=!!roles[x.uid];rt='<div class="panel" style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b style="font-size:14px">Başkan yetkisi</b><div class="muted">'+(on?'Bu kişi duyuru paylaşabilir, programı ve hakları düzenleyebilir, sınıfı görebilir.':'Verirsen duyuru, program, haklar ve sınıf listesine erişir.')+'</div></div><button class="btn '+(on?'red':'dark')+'" style="white-space:nowrap" data-a="role" data-id="'+esc(x.uid)+'" data-on="'+(on?0:1)+'">'+(on?'Geri al':'Yetki ver')+'</button></div>'+(adminMsg?'<div class="ok">'+esc(adminMsg)+'</div>':'')}
  return'<button class="back" data-a="go" data-v="sinif">‹ Sınıf</button><h2 style="margin-top:6px">'+esc(x.name||x.email)+' <span>· '+esc(x.email||"")+'</span></h2>'+rt+ozetView(x.abs||[],false)+'<h2>Geçmiş</h2>'+histList(x.abs||[],false);
}

function ayarView(total){
  let h='<h2>Hesap</h2><div class="panel"><form data-form="name"><label class="f" style="margin-top:0">Adın soyadın (başkanın listesinde görünür)</label><div class="row2"><input name="n" value="'+esc((prof&&prof.name)||me.name||"")+'"><button class="btn dark" type="submit">Kaydet</button></div></form><p class="muted" style="margin-top:10px">'+esc(me.email)+'</p></div>';
  if(isAdmin){
    h+='<h2>Başkan ayarları</h2><div class="panel menu"><button class="it" data-a="go" data-v="prog">Ders programını düzenle<span>›</span></button><button class="it" data-a="go" data-v="hak">Devamsızlık hakları<span>›</span></button></div>';
  }
  h+='<h2>Eski kayıtları aktar</h2><div class="panel"><p class="muted">Eski devamsızlık sayfandan aldığın kayıt kodunu buraya yapıştır.</p><form data-form="import"><textarea name="j" placeholder=\'{"abs":[...]}\' style="margin-top:10px;font-size:12px"></textarea><button class="btn full" style="margin-top:8px" type="submit">Kayıtları ekle</button></form>'+(importMsg?'<div class="ok">'+esc(importMsg)+'</div>':'')+'</div>';
  h+='<div style="margin-top:22px"><button class="btn red full" data-a="logout">Çıkış yap</button></div>';
  h+='<p class="muted" style="text-align:center;margin-top:14px">Devamsızlıklarını sen ve sınıf başkanı görebilir.</p>';
  return h;
}

function progView(){
  if(!isAdmin)return'';
  if(!draft)draft=clone(C());
  const D=draft;const sopts=sel=>D.order.map(k=>'<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(D.subjects[k].n)+'</option>').join("");
  const topts=sel=>'<option value="d"'+(sel==="d"?' selected':'')+'>Ders</option><option value="m"'+(sel==="m"?' selected':'')+'>Muhazire</option>';
  let h='<button class="back" data-a="go" data-v="ayar">‹ Ayarlar</button><h2 style="margin-top:6px">Dersler</h2><div class="panel">';
  D.order.forEach(k=>{h+='<div class="subj"><input data-e="subjects.'+k+'.n" value="'+esc(D.subjects[k].n)+'"><select data-e="subjects.'+k+'.c">'+PALETTE.map(p=>'<option value="'+p[1]+'"'+(p[1]===D.subjects[k].c?' selected':'')+'>'+p[0]+'</option>').join("")+'</select></div>'});
  h+='<button class="btn line full" style="margin-top:10px" data-a="addsubj">+ Ders ekle</button></div>';
  for(let d=1;d<=5;d++){
    h+='<h2>'+DAYS[d]+'</h2><div class="panel ed-day">';
    const day=D.sch[d]||[];
    if(!day.length)h+='<div class="empty" style="padding:6px 0">Ders yok</div>';
    day.forEach((sl,i)=>{
      const p='sch.'+d+'.'+i;
      h+='<div class="ed-slot"><div class="g"><input data-e="'+p+'.t" value="'+esc(sl.t)+'" placeholder="08.30"><input data-e="'+p+'.l" value="'+esc(sl.l)+'" placeholder="Görünen ad"><button class="x" data-a="rmslot" data-d="'+d+'" data-i="'+i+'">×</button></div>';
      h+='<div class="lbl">Ders</div><div class="o"><select data-e="'+p+'.o.0.0">'+sopts(sl.o[0]&&sl.o[0][0])+'</select><select data-e="'+p+'.o.0.1">'+topts(sl.o[0]&&sl.o[0][1])+'</select></div>';
      const o2=sl.o[1];
      h+='<div class="lbl">Alternatif (iki dersten biri işleniyorsa)</div><div class="o"><select data-e="'+p+'.o.1.0"><option value="">— yok —</option>'+sopts(o2&&o2[0])+'</select><select data-e="'+p+'.o.1.1"'+(o2?'':' disabled')+'>'+topts(o2?o2[1]:"d")+'</select></div></div>';
    });
    h+='<button class="btn line full" style="margin-top:10px" data-a="addslot" data-d="'+d+'">+ Saat ekle</button></div>';
  }
  h+='<button class="btn dark full" style="margin-top:16px" data-a="saveprog">Programı kaydet</button>'+(adminMsg?'<div class="ok">'+esc(adminMsg)+'</div>':'')+'<button class="btn full" style="margin-top:8px" data-a="cancelprog">Vazgeç</button>';
  return h;
}

function hakView(){
  if(!isAdmin)return'';
  if(!hdraft)hdraft={lim:clone(C().lim||{}),done:clone(C().done||{})};
  const H=HAS();
  let h='<button class="back" data-a="go" data-v="ayar">‹ Ayarlar</button><h2 style="margin-top:6px">Devamsızlık hakları <span>· ders cinsinden (örn. 7,5)</span></h2><div class="panel">';
  C().order.forEach(s=>{
    const L=hdraft.lim[s]||{},hs=H[s]||{d:true,m:false};
    h+='<div class="hk" style="'+col(s)+'"><div class="row" style="padding:0;border:0"><div class="nm"><i></i>'+esc(sname(s))+'</div></div><div class="g">';
    if(hs.d||!hs.m)h+='<label>Ders hakkı<input inputmode="decimal" data-h="'+s+'.d" value="'+(L.d?f(L.d):"")+'" placeholder="–"></label>';
    if(hs.m)h+='<label>Muhazire hakkı<input inputmode="decimal" data-h="'+s+'.m" value="'+(L.m?f(L.m):"")+'" placeholder="–"></label>';
    h+='</div>';
    if(hs.d&&hs.m)h+='<label class="tgl"><input type="checkbox" data-hd="'+s+'"'+(hdraft.done[s]?' checked':'')+'> Muhazireler bitti (kalan hak derse eklensin)</label>';
    h+='</div>';
  });
  h+='</div><button class="btn dark full" style="margin-top:16px" data-a="savehak">Hakları kaydet</button>'+(adminMsg?'<div class="ok">'+esc(adminMsg)+'</div>':'')+'<p class="muted" style="margin-top:10px">Hakkı kadar kaçıran "limitte", hakkını aşan "kesildi" görünür.</p>';
  return h;
}

/* ============================================================
   OLAYLAR
   ============================================================ */
function go(v){
  if(v==="duyuru"){markAnnSeen()}
  if(v==="sinif"||v==="uye"){if(!users)loadUsers()}
  if(v!=="prog")draft=null; if(v!=="hak")hdraft=null;
  if(v!=="duyuru"&&v!=="prog"&&v!=="hak")adminMsg="";
  importMsg=""; pend=null; view=v; render(); window.scrollTo(0,0);
}
async function checkAdmin(){try{users=await B.listUsers();isAdmin=true}catch(_){isAdmin=false;users=null;if(["sinif","uye","prog","hak"].includes(view))view="ozet"}render()}
async function loadUsers(){usersErr="";try{users=await B.listUsers()}catch(e){usersErr=errText(e);users=null}render()}
function setPath(o,path,val){const p=path.split(".");let x=o;for(let i=0;i<p.length-1;i++){if(x[p[i]]==null)x[p[i]]=/^\d+$/.test(p[i+1])?[]:{};x=x[p[i]]}x[p[p.length-1]]=val}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="go")return go(b.dataset.v);
  if(a==="lmode"){loginMode=b.dataset.v;loginErr="";loginOk="";return render()}
  if(a==="google"){loginErr="";try{await B.google()}catch(x){loginErr=errText(x);render()}return}
  if(a==="logout"){await B.out();return}
  if(a==="day"){pend=null;const d=parse(selISO),n=+b.dataset.v;do{d.setDate(d.getDate()+n)}while(d.getDay()===0||d.getDay()===6);selISO=iso(d);return render()}
  if(a==="today"){pend=null;selISO=today();return render()}
  if(a==="pick"){pend={t:b.dataset.t,s:b.dataset.s,k:b.dataset.k};return render()}
  if(a==="cancel"){pend=null;return render()}
  if(a==="add"){if(!pend||findAbs(selISO,pend.t))return;const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:selISO,t:pend.t,s:pend.s,k:pend.k,p:b.dataset.p};pend=null;return setAbs(abs().concat([r]))}
  if(a==="del")return setAbs(abs().filter(x=>x.id!==b.dataset.id));
  if(a==="full")return setAbs(abs().map(x=>x.id===b.dataset.id?Object.assign({},x,{p:"t"}):x));
  if(a==="delann"){try{await B.delAnn(b.dataset.id)}catch(x){adminMsg=errText(x);render()}return}
  if(a==="uye"){viewing=b.dataset.id;return go("uye")}
  if(a==="role"){try{await B.setRole(b.dataset.id,b.dataset.on==="1");adminMsg=b.dataset.on==="1"?"Başkan yetkisi verildi ✓":"Yetki geri alındı ✓"}catch(x){adminMsg=errText(x)}return render()}
  if(a==="refresh"){users=null;render();return loadUsers()}
  if(a==="addsubj"){const k="s"+Date.now().toString(36);draft.subjects[k]={n:"Yeni ders",c:PALETTE[draft.order.length%PALETTE.length][1]};draft.order.push(k);return render()}
  if(a==="addslot"){const d=b.dataset.d;(draft.sch[d]=draft.sch[d]||[]).push({t:"",l:"",o:[[draft.order[0],"d"]]});return render()}
  if(a==="rmslot"){draft.sch[b.dataset.d].splice(+b.dataset.i,1);return render()}
  if(a==="cancelprog"){draft=null;return go("ayar")}
  if(a==="saveprog"){
    const D=clone(draft);
    for(const d in D.sch){D.sch[d]=D.sch[d].filter(sl=>sl.o&&sl.o[0]&&sl.o[0][0]).map(sl=>({t:(sl.t||"").trim(),l:(sl.l||"").trim()||D.subjects[sl.o[0][0]].n,o:sl.o.filter(o=>o&&o[0]).map(o=>[o[0],o[1]||"d"])})).sort((x,y)=>x.t<y.t?-1:1)}
    D.lim=C().lim||{};D.done=C().done||{};
    try{await B.saveClass(D);adminMsg="Program kaydedildi ✓ Herkeste güncellendi.";draft=null}catch(x){adminMsg=errText(x)}
    return render();
  }
  if(a==="savehak"){
    const D=clone(C());D.lim=hdraft.lim;D.done=hdraft.done;
    try{await B.saveClass(D);adminMsg="Haklar kaydedildi ✓ Herkeste güncellendi."}catch(x){adminMsg=errText(x)}
    return render();
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.e&&draft){setPath(draft,t.dataset.e,t.value);
    if(/\.o\.1\.0$/.test(t.dataset.e)){const p=t.dataset.e.split(".");const sl=draft.sch[p[1]][+p[2]];if(!t.value)sl.o=[sl.o[0]];else{sl.o[1]=[t.value,(sl.o[1]&&sl.o[1][1])||"d"]}render()}
    else if(/subjects\.\w+\.c$/.test(t.dataset.e))render();
    return}
  if(t.dataset.h&&hdraft){const [s,k]=t.dataset.h.split(".");const v=Math.round(parseFloat(String(t.value).replace(",","."))*2);const o=hdraft.lim[s]||{};if(v>0)o[k]=v;else delete o[k];if(o.d||o.m)hdraft.lim[s]=o;else delete hdraft.lim[s];return}
  if(t.dataset.hd&&hdraft){if(t.checked)hdraft.done[t.dataset.hd]=true;else delete hdraft.done[t.dataset.hd];return}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const fm=e.target,k=fm.dataset.form,v=n=>(fm.elements[n]&&fm.elements[n].value||"").trim();
  if(k==="login"){
    loginErr="";loginOk="";busy=true;render();
    try{
      if(loginMode==="up"){if(!v("n"))throw{code:"İsim gerekli"};await B.emailUp(v("e"),fm.elements.p.value,v("n"))}
      else if(loginMode==="reset"){await B.reset(v("e"));loginOk="Şifre sıfırlama bağlantısı e-postana gönderildi.";loginMode="in"}
      else await B.emailIn(v("e"),fm.elements.p.value);
    }catch(x){loginErr=errText(x)}
    busy=false;render();return;
  }
  if(k==="ann"){const t=v("t");if(!t)return;try{await B.addAnn(t,(prof&&prof.name)||me.name||"Sınıf başkanı");adminMsg="Duyuru paylaşıldı ✓";markAnnSeen()}catch(x){adminMsg=errText(x)}render();return}
  if(k==="name"){prof=prof||{};prof.name=v("n");saveMe();return}
  if(k==="import"){
    try{let j=JSON.parse(fm.elements.j.value);const list=Array.isArray(j)?j:(j.abs||[]);
      const have=new Set(abs().map(x=>x.d+"|"+x.t));let n=0;const add=[];
      list.forEach(x=>{if(x&&x.d&&x.t&&x.s&&!have.has(x.d+"|"+x.t)){add.push({id:x.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:x.d,t:x.t,s:x.s,k:x.k||"d",p:x.p||"t"});have.add(x.d+"|"+x.t);n++}});
      importMsg=n+" kayıt eklendi ✓";setAbs(abs().concat(add));
    }catch(x){importMsg="Kod okunamadı. Tamamını kopyaladığından emin ol.";render()}
    return;
  }
});

/* ============================================================
   BAŞLAT
   ============================================================ */
async function start(){
  if(!MOCK&&!firebaseConfig.apiKey){
    $app.innerHTML='<div class="setup"><h1>Kurulum gerekli</h1><p class="muted" style="margin-top:10px">Bu dosyanın en üstündeki <code>firebaseConfig</code> kısmına Firebase bilgilerini yapıştır. Denemek için adresin sonuna <code>?mock</code> ekleyebilirsin.</p></div>';return}
  try{B=MOCK?mockBackend():await firebaseBackend()}
  catch(e){$app.innerHTML='<div class="setup"><h1>Bağlanamadı</h1><p class="muted" style="margin-top:10px">İnternet bağlantını kontrol edip sayfayı yenile.</p></div>';return}
  me=undefined;render();
  B.onAuth(async user=>{
    unsub.forEach(f=>{try{f()}catch(_){}});unsub=[];
    me=user;prof=null;cls=null;anns=[];isAdmin=null;users=null;view="ozet";statusMsg="";
    if(!user){loginMode="in";loginErr="";loginOk="";render();return}
    isDev=MOCK?/^dev/.test(user.email):DEV_EMAILS.map(x=>x.toLowerCase()).includes((user.email||"").toLowerCase());
    unsub.push(B.watchClass(d=>{cls=d;render()},()=>{}));
    unsub.push(B.watchRoles(r=>{const was=roles[user.uid];roles=r||{};if(!!was!==!!roles[user.uid])checkAdmin();render()},()=>{}));
    unsub.push(B.watchAnn(d=>{anns=d;render()},()=>{}));
    unsub.push(B.watchMe(user.uid,d=>{if(!saveTimer||statusMsg!=="Kaydediliyor…"){prof=d||{abs:[]};render()}},()=>{}));
    // İlk girişte profil oluştur
    setTimeout(async()=>{if(!prof||!prof.email){try{await B.saveMe(user.uid,{name:(prof&&prof.name)||user.name||user.email.split("@")[0],email:user.email,abs:(prof&&prof.abs)||[],at:Date.now()})}catch(_){}}},800);
    checkAdmin();
  });
}
start();
